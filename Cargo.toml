[workspace]
members = ["crates/sdk", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Build and manage Firecracker MicroVMs on Linux."

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
inquire = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
semver = "1.0"
base64 = "0.22"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tempfile = "3.27"
tokio-util = { version = "0.7", features = ["rt"] }
