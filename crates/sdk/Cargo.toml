[package]
name = "taumaru-microvm"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
publish = ["crates-io"]
repository = "https://github.com/Taumaru/taumaru-microvm"
homepage = "https://github.com/Taumaru/taumaru-microvm"
keywords = ["firecracker", "microvm", "virtualization", "kvm", "sdk"]
categories = ["virtualization", "api-bindings"]

[lib]
path = "src/lib.rs"

[dependencies]
base64.workspace = true
reqwest.workspace = true
ring.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
fs4.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
